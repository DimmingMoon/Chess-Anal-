<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
function makeEngine(){

const LMR=new Int8Array(4096);for(let d=1;d<64;d++)for(let m=1;m<64;m++)LMR[d*64+m]=Math.round(.55+Math.log(d)*Math.log(m)/2.2);

const sqn=s=>'abcdefgh'[s&7]+((s>>4)+1);
let ST={att:0,pos:0,safe:0,trade:0},stk='';function style(x){x=x||{att:0,pos:0,safe:0,trade:0};const k=JSON.stringify(x);if(k!==stk){stk=k;ST=x;tK.fill(0);EK.fill(0)}}
function hash(){hA=hB=0;for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=B[r*16+f];if(p)zp(p,r*16+f)}if(side<0)zx(1560);zx(1536+cast);if(ep>=0)zx(1552+(ep&7))}

function seeGain(g,sq){const c=g.moves({verbose:true}).filter(m=>m.to==sq&&m.captured);if(!c.length)return 0;c.sort((a,b)=>KV[a.piece]-KV[b.piece]);const m=c[0];g.move(m);const v=Math.max(0,V[m.captured]-seeGain(g,sq));g.undo();return v}
function sac(i,m){if(!'nbrq'.includes(m.piece))return false;return seeGain(new Chess(FEN[i+1]),m.to)-(m.captured?V[m.captured]:0)>=200}

function pickLegitThrow(fen, top) {
  if (!top || top.length < 2) return top;
  const g = new Chess(fen), turn = g.turn(), sn = turn === 'w' ? 1 : -1;
  const ply = (g.fen().split(' ')[5] - 1) * 2 + (turn === 'b' ? 1 : 0);
  if (ply < 6) return top;
  const bestScore = sn * top[0].s;
  if (bestScore < -450 && (ply % 3 === 0)) return top;

  const cands = [];
  for (let i = 1; i < top.length; i++) {
    const item = top[i], m = item.m;
    const sc = sn * item.s;
    const drop = bestScore - sc;
    const g2 = new Chess(fen);
    g2.move({ from: m.from, to: m.to, promotion: m.promotion || 'q' });
    const hanging = seeGain(g2, m.to) - (m.captured ? V[m.captured] : 0);

    if (drop >= 40 && drop <= 175 && hanging < 180) {
      cands.push({ item, drop, weight: 100 - Math.abs(drop - 95) });
    } else if (drop > 20 && drop <= 240 && hanging < 280) {
      cands.push({ item, drop, weight: 30 });
    }
  }
  if (!cands.length) return [top[Math.min(2, top.length - 1)], ...top];
  cands.sort((a, b) => b.weight - a.weight);
  const chosen = cands[0].item;
  chosen.legitWait = (2.5 + Math.random() * 4.5).toFixed(1);
  chosen.legitDrop = (cands[0].drop / 100).toFixed(2);
  return [chosen, ...top.filter(x => x !== chosen)];
}

const pop=$('pop');$('gear').onclick=()=>pop.classList.toggle('o');$('px').onclick=()=>pop.classList.remove('o');
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.gw'))pop.classList.remove('o')});
document.addEventListener('keydown',e=>{if(e.key=='Escape')pop.classList.remove('o')});
document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button[data-t]').forEach(x=>x.classList.toggle('a',x==b));document.querySelectorAll('.pane').forEach((p,i)=>p.classList.toggle('a',i==+b.dataset.t))});
$('comp').onclick=()=>{comp=!comp;render();engine()};
$('legit').onclick=()=>{legitThrow=!legitThrow;render();if(!busy)think(view).then(()=>{render();engine()})};
$('un').onclick=()=>{if(busy||FEN.length<2)return;const n=comp&&FEN.length>2?2:1;FEN.length=MV.length=AN.length=CL.length=FEN.length-n;view=FEN.length-1;sel=null;legal=[];render()};
$('rs').onclick=async()=>{if(busy)return;FEN=[new Chess().fen()];MV=[null];AN=[null];CL=[null];view=0;sel=null;legal=[];await think(0);render();engine()};
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowLeft')go(view-1);else if(e.key=='ArrowRight')go(view+1)});
(async()=>{busy=true;render();await initW();await think(0);render()})();
</script></body></html>
